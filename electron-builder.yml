# 历史安装标识：暂留以保护升级兼容性；正式品牌与标识迁移待用户确认。
appId: com.electron.app
productName: dude-app
directories:
  output: D:/coding/completed/dude-app
  buildResources: build
afterPack: scripts/after-pack-win-icon.cjs
files:
  - '!.tmp/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraFiles:
  - from: build/cli/
    to: .
  - from: docs/wiki/
    to: docs
    filter:
      - AGENT_SOFTWARE_MANUAL.md
      - CLI_命令大全.md
asarUnpack:
  - resources/**
win:
  icon: build/icon.ico
  executableName: dude-app
  signAndEditExecutable: false
nsis:
  include: build/installer.nsh
  artifactName: ${name}-${version}-setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# 尚无经确认的更新服务器；不得产生或发布虚假更新元数据。
publish: null
