name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已有版本标签，例如 v2.0.5（必须匹配 package.json）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw '发布标签必须为 v 加 package.json 的完整版本号'
          }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pin npm
        run: npm install --global npm@11.6.2
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test through Electron wrapper
        run: npm test
      - name: Build
        run: npm run build
      - name: Build Windows installer
        run: npm run build:win:installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: D:/coding/completed/dude-app/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Release ${{ needs.build.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: installer/*.exe
